<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>let’s go!</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/assets/miniapp.css?v=__ASSET_VERSION__" />
  </head>
  <body>
    <div id="loading" class="loading">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
    <div id="app" class="hidden">
      <header class="top">
        <b class="logo">let’s go!</b
        ><button id="avatar" class="avatar">LG</button>
      </header>
      <main id="content"></main>
      <nav class="nav">
        <button data-tab="ideas" class="active"><i>💡</i>Идеи</button
        ><button data-tab="vote"><i>🗳</i>Выбор</button
        ><button data-tab="activity"><i>📍</i>План</button
        ><button data-tab="archive"><i>🖼</i>Архив</button>
      </nav>
    </div>
    <div class="modal" id="ideaModal">
      <div class="sheet">
        <button class="close">×</button>
        <h2 id="ideaTitle">Новая идея</h2>
        <form id="ideaForm">
          <label>Что хотите сделать?</label
          ><input name="title" maxlength="180" required /><label
            >Описание (необязательно)</label
          ><textarea name="description" maxlength="1000"></textarea>
          <div id="ratings"></div>
          <label
            ><input type="checkbox" name="anonymous" style="width: auto" />
            Скрыть автора</label
          ><button class="primary">Сохранить</button>
        </form>
      </div>
    </div>
    <div class="modal" id="companyModal">
      <div class="sheet">
        <button class="close">×</button>
        <h2>Новая компания</h2>
        <p>Отдельное пространство для каждой компании друзей.</p>
        <form id="companyForm">
          <label>Название</label
          ><input name="name" minlength="2" required /><button class="primary">
            Создать
          </button>
        </form>
      </div>
    </div>
    <div class="modal" id="accountModal">
      <div class="sheet">
        <button class="close">×</button>
        <h2>Компания и профиль</h2>
        <div id="accountBody"></div>
      </div>
    </div>
    <div class="modal" id="onboarding">
      <div class="sheet">
        <h2>Как работает let’s go!</h2>
        <div class="steps">
          <div>1. 💡 Соберите идеи и обсудите их.</div>
          <div>2. 🗳 Выберите идею и удобную дату.</div>
          <div>3. 📸 Подтвердите встречу вместе и добавьте фото.</div>
        </div>
        <button class="primary" id="gotIt">Понятно, поехали!</button>
      </div>
    </div>
    <script src="/assets/miniapp.js?v=__ASSET_VERSION__" defer></script>
  </body>
</html>
