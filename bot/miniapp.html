<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>let’s go!</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#f5f1e9;--ink:#151515;--blue:#3457ff;--lime:#caff3d;--orange:#ff641f;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}.top{padding:16px 16px 6px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:950;letter-spacing:-2px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--lime);font-weight:900}.hero{margin:8px 12px 13px;padding:19px 20px;border-radius:22px;background:var(--blue);color:white;box-shadow:4px 5px 0 var(--ink)}.hero small{opacity:.8;text-transform:uppercase;font-weight:800}.hero h1{font-size:29px;line-height:1;letter-spacing:-1.7px;margin:9px 0}.hero p{margin:0}.section{padding:8px 12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 1px 10px}.section h2{margin:0;font-size:23px;letter-spacing:-1px}.head-actions{display:flex;align-items:center;gap:5px}.link{border:0;background:none;font-weight:800;color:var(--blue);padding:8px}.add-inline{border:2px solid var(--ink);background:var(--orange);border-radius:999px;padding:8px 11px;font-weight:900;box-shadow:2px 2px 0 var(--ink)}.card{background:var(--card);border:2px solid var(--ink);border-radius:17px;padding:14px;margin-bottom:9px;box-shadow:2px 3px 0 var(--ink)}.card h3{font-size:19px;margin:0 0 3px}.desc{color:#686868;margin:4px 0 9px}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{padding:5px 8px;background:#efefef;border-radius:99px;font-size:11px;font-weight:750}.author{font-size:11px;color:#777;margin-top:8px}.primary,.secondary{width:100%;border:2px solid var(--ink);border-radius:12px;padding:12px;font:inherit;font-weight:900;box-shadow:2px 2px 0 var(--ink)}.primary{background:var(--lime)}.secondary{background:white;margin-top:8px}.vote-btn.selected{background:var(--blue);color:white}.empty{text-align:center;padding:32px 18px;color:#666}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.94);backdrop-filter:blur(15px);padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #ddd}.nav button{border:0;background:none;font-size:10px;color:#666;padding:3px}.nav i{display:block;font-style:normal;font-size:21px;margin-bottom:1px}.nav .active{color:var(--ink);font-weight:900}.modal{display:none;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:22px 18px calc(25px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 18px;font-size:28px}.close{float:right;border:0;background:#ddd;width:34px;height:34px;border-radius:50%;font-size:20px}label{display:block;font-size:13px;font-weight:800;margin:14px 0 6px}input,textarea{width:100%;border:2px solid;border-radius:12px;padding:13px;background:white;font:inherit}textarea{min-height:85px}.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.rating input{display:none}.rating label{margin:0;text-align:center;padding:11px;border:2px solid;border-radius:10px;background:white}.rating input:checked+label{background:var(--blue);color:white}.notice{padding:11px;border-radius:12px;background:#fff0be;margin-bottom:10px}.hidden{display:none!important}.error{background:#ffd2cc;padding:12px;border-radius:12px;margin:18px}.winner{background:var(--lime)}.loading{padding:16px 12px}.skeleton-top{height:38px;width:42%;border-radius:10px}.skeleton-hero{height:128px;margin-top:15px;border-radius:22px}.skeleton-title{height:25px;width:34%;margin:24px 0 12px;border-radius:8px}.skeleton-card{height:112px;margin:9px 0;border-radius:17px}.shimmer{background:linear-gradient(90deg,#e9e4da 25%,#fff 45%,#e9e4da 65%);background-size:300% 100%;animation:shimmer 1.2s infinite}@keyframes shimmer{to{background-position:-150% 0}}@media(prefers-reduced-motion:reduce){.shimmer{animation:none}}
</style></head><body><div id="loading" class="loading" aria-label="Загружаем приложение"><div class="skeleton-top shimmer"></div><div class="skeleton-hero shimmer"></div><div class="skeleton-title shimmer"></div><div class="skeleton-card shimmer"></div><div class="skeleton-card shimmer"></div></div><div id="app" class="hidden"><header class="top"><div class="logo">let’s go!</div><div class="avatar" id="avatar">LG</div></header><main id="content"></main><nav class="nav"><button data-tab="ideas" class="active"><i>💡</i>Идеи</button><button data-tab="vote"><i>🗳</i>Голосование</button><button data-tab="activity"><i>📍</i>Активность</button><button data-tab="archive"><i>🖼</i>Архив</button></nav></div>
<div class="modal" id="ideaModal"><div class="sheet"><button class="close">×</button><h2>Новая идея</h2><form id="ideaForm"><label>Что хотите сделать?</label><input name="title" maxlength="180" required placeholder="Например, ночной пикник"><label>Описание <span style="font-weight:400">(необязательно)</span></label><textarea name="description" maxlength="1000" placeholder="Место, детали, что взять с собой…"></textarea><div id="ratings"></div><label><input type="checkbox" name="anonymous" style="width:auto"> Скрыть автора</label><button class="primary">Добавить идею</button></form></div></div>
<div class="modal" id="companyModal"><div class="sheet"><h2>Создайте компанию</h2><p>Пригласите друзей и начните собирать идеи.</p><form id="companyForm"><label>Название компании</label><input name="name" minlength="2" required placeholder="Свои люди"><button class="primary">Создать</button></form></div></div>
<div class="modal" id="planModal"><div class="sheet"><h2>Победитель определён 🎉</h2><p id="winnerText"></p><form id="planForm"><label>Когда встречаемся?</label><input type="datetime-local" name="scheduled_at" required><button class="primary">Запланировать</button></form></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const localTest=['localhost','127.0.0.1'].includes(location.hostname);const init=tg?.initData||(localTest?new URLSearchParams(location.search).get('test_init_data')||'':'');let data=null,tab='ideas',winner=null;
const api=async(path,options={})=>{const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':init,...options.headers}});if(!r.ok)throw new Error(await r.text());return r.json()};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const flash=e=>{try{if(tg?.isVersionAtLeast?.('6.2'))tg.showAlert(e.message);else alert(e.message)}catch(_){alert(e.message)}};async function load(){try{data=await api('/api/bootstrap');document.querySelector('#loading').classList.add('hidden');document.querySelector('#app').classList.remove('hidden');document.querySelector('#avatar').textContent=(data.user.first_name||'LG').slice(0,2).toUpperCase();if(!data.company)document.querySelector('#companyModal').classList.add('open');render()}catch(e){document.querySelector('#loading').innerHTML='<div class="error">Откройте приложение кнопкой внутри Telegram.</div>'}}
function ideaCard(x,vote=false,selectedTitle=''){const selected=vote&&x.title===selectedTitle;return `<article class="card"><h3>${esc(x.title)}</h3>${x.description?`<p class="desc">${esc(x.description)}</p>`:''}<div class="chips"><span class="chip">сложность ${x.difficulty}/5</span><span class="chip">бюджет ${x.budget}/5</span><span class="chip">время ${x.duration}/5</span></div><div class="author">${x.anonymous?'🎲 автор скрыт':esc(x.author)}</div>${vote?`<button class="secondary vote-btn ${selected?'selected':''}" data-idea="${x.id}">${selected?'✓ Ваш выбор':'Выбрать'}</button>`:''}</article>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const c=document.querySelector('#content');if(!data?.company)return;c.innerHTML=`<section class="hero"><small>${esc(data.company.name)}</small><h1>${tab==='ideas'?'Что сделаем вместе?':tab==='vote'?'Выбираем следующее':tab==='activity'?'Текущий план':'Наши воспоминания'}</h1><p>${data.members.length} ${data.members.length===1?'участник':'участника'}</p></section><section class="section" id="body"></section>`;const b=document.querySelector('#body');if(tab==='ideas'){b.innerHTML=`<div class="section-head"><h2>Идеи</h2><div class="head-actions"><button class="link" id="invite">Пригласить</button><button class="add-inline" id="addInline">+ Добавить</button></div></div>${data.ideas.length?data.ideas.map(x=>ideaCard(x)).join(''):'<div class="empty">Пока нет идей. Добавьте первую!</div>'}`;document.querySelector('#invite').onclick=()=>tg?.openTelegramLink(`https://t.me/lets_go_friends_bot?start=join_${data.company.invite_code}`);document.querySelector('#addInline').onclick=()=>document.querySelector('#ideaModal').classList.add('open')}
if(tab==='vote'){const v=data.vote,current=v?.members.find(m=>Number(m.id)===Number(data.user.id));b.innerHTML=v?`<div class="notice">Организатор: <b>${esc(v.organizer)}</b><br>${current?.idea_title?`Ваш выбор: <b>${esc(current.idea_title)}</b>. Его можно изменить.`:'Вы ещё не голосовали. Выбор можно изменить до завершения.'}</div>${data.ideas.map(x=>ideaCard(x,true,current?.idea_title)).join('')}<div class="card"><b>✅ Проголосовали:</b> ${v.members.filter(m=>m.idea_title).map(m=>esc(m.display_name)).join(', ')||'пока никто'}<br><br><b>⏳ Ожидаем:</b> ${v.members.filter(m=>!m.idea_title).map(m=>esc(m.display_name)).join(', ')||'все проголосовали'}<button class="primary" id="closeVote" style="margin-top:16px">Завершить голосование</button></div>`:`<div class="empty">Голосование ещё не начато.</div><button class="primary" id="startVote">Начать голосование</button>`;document.querySelectorAll('.vote-btn').forEach(x=>x.onclick=()=>castVote(x,v.id,+x.dataset.idea));if(!v)document.querySelector('#startVote').onclick=()=>act('/api/vote/start',{});else document.querySelector('#closeVote').onclick=closeVote}
if(tab==='activity'){const a=data.activity;b.innerHTML=a?`<article class="card winner"><small>ЗАПЛАНИРОВАНО</small><h3>${esc(a.title)}</h3><p>${new Date(a.scheduled_at).toLocaleString('ru-RU',{dateStyle:'long',timeStyle:'short'})}</p><p class="desc">Подтверждение выполнения и фото пока можно добавить в чате бота.</p></article>`:'<div class="empty">Сейчас нет запланированной активности.</div>'}
if(tab==='archive')b.innerHTML=data.archive.length?data.archive.map(x=>`<article class="card"><small>🏆 ВЫПОЛНЕНО</small><h3>${esc(x.title)}</h3><p>${new Date(x.scheduled_at).toLocaleDateString('ru-RU')}</p></article>`).join(''):'<div class="empty">Архив появится после первой выполненной активности.</div>'}
async function act(path,body){try{await api(path,{method:'POST',body:JSON.stringify(body)});await refresh()}catch(e){flash(e)}}async function refresh(){data=await api('/api/bootstrap');render()}
async function castVote(button,roundId,ideaId){document.querySelectorAll('.vote-btn').forEach(x=>{x.classList.remove('selected');x.textContent='Выбрать'});button.classList.add('selected');button.textContent='Сохраняем…';try{await api('/api/vote/cast',{method:'POST',body:JSON.stringify({round_id:roundId,idea_id:ideaId})});if(tg?.isVersionAtLeast?.('6.1'))tg.HapticFeedback.notificationOccurred('success');await refresh()}catch(e){await refresh();flash(e)}}
async function closeVote(){try{const r=await api('/api/vote/close',{method:'POST',body:JSON.stringify({round_id:data.vote.id})});winner=r.winner;document.querySelector('#winnerText').textContent=`Победила идея «${winner.title}». Сразу назначьте дату, чтобы друзья получили напоминание.`;const input=document.querySelector('#planForm input');input.min=new Date().toISOString().slice(0,16);input.value=new Date(Date.now()+86400000).toISOString().slice(0,16);document.querySelector('#planModal').classList.add('open')}catch(e){flash(e)}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('#ideaModal .close').onclick=()=>document.querySelector('#ideaModal').classList.remove('open');
const labels=[['difficulty','Сложность'],['budget','Бюджет'],['duration','Длительность']];document.querySelector('#ratings').innerHTML=labels.map(([n,l])=>`<label>${l} · от 1 до 5</label><div class="rating">${[1,2,3,4,5].map(i=>`<input id="${n}${i}" type="radio" name="${n}" value="${i}" ${i===1?'required':''}><label for="${n}${i}">${i}</label>`).join('')}</div>`).join('');
document.querySelector('#ideaForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),body=Object.fromEntries(f);body.anonymous=f.has('anonymous');try{await act('/api/ideas',body);e.target.reset();document.querySelector('#ideaModal').classList.remove('open')}catch(e){flash(e)}};document.querySelector('#companyForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/company',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target))) });document.querySelector('#companyModal').classList.remove('open');await refresh()}catch(e){flash(e)}};document.querySelector('#planForm').onsubmit=async e=>{e.preventDefault();try{const body=Object.fromEntries(new FormData(e.target));body.idea_id=winner.id;await api('/api/plan',{method:'POST',body:JSON.stringify(body)});document.querySelector('#planModal').classList.remove('open');tab='activity';await refresh()}catch(e){flash(e)}};load();
</script></body></html>
