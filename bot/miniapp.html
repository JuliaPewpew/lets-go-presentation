<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>let’s go!</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#f5f1e9;--ink:#151515;--blue:#3457ff;--lime:#caff3d;--orange:#ff641f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:84px}.top,.row,.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.top{padding:16px}.logo{font-size:27px;font-weight:950}.avatar{width:40px;height:40px;border:2px solid;border-radius:50%;background:var(--lime);font-weight:900}.hero{margin:0 12px 13px;padding:19px 20px;border-radius:22px;background:var(--blue);color:white;box-shadow:4px 5px var(--ink)}.hero h1{font-size:29px;line-height:1;margin:9px 0}.hero p{margin:0}.section{padding:8px 12px}.section h2{margin:0}.card{background:white;border:2px solid;border-radius:17px;padding:14px;margin:10px 0;box-shadow:2px 3px var(--ink)}.card h3{font-size:20px;margin:0 0 4px}.desc,.muted{color:#6a6a6a}.chips,.reactions,.actions{display:flex;gap:5px;flex-wrap:wrap}.chip,.reaction{padding:6px 9px;background:#eee;border:0;border-radius:99px;font-size:12px;font-weight:750}.reaction.mine{outline:2px solid var(--blue)}.author{font-size:12px;color:#777;margin:8px 0}.primary,.secondary,.danger,.pill{width:100%;border:2px solid;border-radius:12px;padding:12px;font:inherit;font-weight:900;box-shadow:2px 2px var(--ink)}.primary{background:var(--lime)}.secondary{background:white;margin-top:8px}.danger{background:#ffd2cc;margin-top:8px}.pill{width:auto;background:white;padding:8px}.hot{background:var(--orange)}.selected{background:var(--blue);color:white}.link{border:0;background:none;color:var(--blue);font-weight:800;padding:8px}.comments{border-top:1px solid #ddd;margin-top:10px;padding-top:7px}.comment{font-size:13px;margin:4px}.comment-form{display:flex;gap:5px}.comment-form input{padding:9px}.comment-form button{width:auto;padding:8px;box-shadow:none}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}.filters select{padding:8px;border:2px solid;border-radius:10px;background:white}.notice{padding:12px;border-radius:12px;background:#fff0be;margin:10px 0}.winner{background:var(--lime)}.empty{text-align:center;padding:28px;color:#666}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.archive-photo{width:100%;height:125px;object-fit:cover;border:2px solid;border-radius:12px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fffffff0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #ddd}.nav button{border:0;background:none;font-size:10px;color:#666}.nav i{display:block;font-style:normal;font-size:21px}.nav .active{font-weight:900;color:#111}.modal{display:none;position:fixed;inset:0;z-index:10;background:#0007;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:22px 18px calc(25px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 12px}.close{float:right;border:0;border-radius:50%;width:34px;height:34px;font-size:20px}label{display:block;font-size:13px;font-weight:800;margin:13px 0 6px}input,textarea{width:100%;border:2px solid;border-radius:12px;padding:12px;background:white;font:inherit}textarea{min-height:76px}.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.rating input{display:none}.rating label{margin:0;text-align:center;padding:10px;border:2px solid;border-radius:10px;background:white}.rating input:checked+label{background:var(--blue);color:white}.setting{display:flex;justify-content:space-between;align-items:center}.setting input{width:24px}.steps div{padding:12px;margin:8px 0;background:white;border:2px solid;border-radius:14px}.hidden{display:none!important}.loading{padding:16px}.skeleton{height:120px;margin:12px 0;border-radius:18px;background:#e5e0d7}
</style></head><body><div id="loading" class="loading"><div class="skeleton"></div><div class="skeleton"></div></div><div id="app" class="hidden"><header class="top"><b class="logo">let’s go!</b><button id="avatar" class="avatar">LG</button></header><main id="content"></main><nav class="nav"><button data-tab="ideas" class="active"><i>💡</i>Идеи</button><button data-tab="vote"><i>🗳</i>Выбор</button><button data-tab="activity"><i>📍</i>План</button><button data-tab="archive"><i>🖼</i>Архив</button></nav></div>
<div class="modal" id="ideaModal"><div class="sheet"><button class="close">×</button><h2 id="ideaTitle">Новая идея</h2><form id="ideaForm"><label>Что хотите сделать?</label><input name="title" maxlength="180" required><label>Описание (необязательно)</label><textarea name="description" maxlength="1000"></textarea><div id="ratings"></div><label><input type="checkbox" name="anonymous" style="width:auto"> Скрыть автора</label><button class="primary">Сохранить</button></form></div></div>
<div class="modal" id="companyModal"><div class="sheet"><button class="close">×</button><h2>Новая компания</h2><p>Отдельное пространство для каждой компании друзей.</p><form id="companyForm"><label>Название</label><input name="name" minlength="2" required><button class="primary">Создать</button></form></div></div>
<div class="modal" id="accountModal"><div class="sheet"><button class="close">×</button><h2>Компания и профиль</h2><div id="accountBody"></div></div></div>
<div class="modal" id="onboarding"><div class="sheet"><h2>Как работает let’s go!</h2><div class="steps"><div>1. 💡 Соберите идеи и обсудите их.</div><div>2. 🗳 Выберите идею и удобную дату.</div><div>3. 📸 Подтвердите встречу вместе и добавьте фото.</div></div><button class="primary" id="gotIt">Понятно, поехали!</button></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const test=['localhost','127.0.0.1'].includes(location.hostname),init=tg?.initData||(test?new URLSearchParams(location.search).get('test_init_data')||'':'');let data,tab='ideas',editing=null,filters={difficulty:5,budget:5,duration:5};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),modal=(id,on=true)=>document.querySelector(id).classList.toggle('open',on);
const api=async(path,opt={})=>{const h={'X-Telegram-Init-Data':init,...opt.headers};if(!(opt.body instanceof FormData))h['Content-Type']='application/json';const r=await fetch(path,{...opt,headers:h});if(!r.ok)throw Error(await r.text());return r.json()},flash=e=>{try{tg?.showAlert?.(e.message||String(e))}catch(_){alert(e.message)}};
async function refresh(){data=await api('/api/bootstrap');render()}async function act(path,body={},method='POST'){try{await api(path,{method,body:body instanceof FormData?body:JSON.stringify(body)});await refresh()}catch(e){flash(e)}}
async function load(){try{await refresh();loading.classList.add('hidden');app.classList.remove('hidden');avatar.textContent=(data.user.first_name||'LG').slice(0,2).toUpperCase();if(!data.company)modal('#companyModal');if(!localStorage.getItem('lg-onboarding'))modal('#onboarding')}catch(e){loading.innerHTML='<div class="notice">Откройте приложение кнопкой внутри Telegram.</div>'}}
function card(x,vote=false,selected=''){const can=+x.author_id===+data.user.id||+data.company.owner_id===+data.user.id;return `<article class="card"><h3>${esc(x.title)}</h3>${x.description?`<p class="desc">${esc(x.description)}</p>`:''}<div class="chips"><span class="chip">сложность ${x.difficulty}/5</span><span class="chip">бюджет ${x.budget}/5</span><span class="chip">время ${x.duration}/5</span></div><div class="author">${x.anonymous?'🎲 автор скрыт':esc(x.author)}</div>${vote?`<button class="secondary vote-btn ${x.title===selected?'selected':''}" data-id="${x.id}">${x.title===selected?'✓ Ваш выбор':'Выбрать'}</button>`:`<div class="reactions">${['👍','❤️','🔥'].map(e=>{const r=x.reactions.find(y=>y.emoji===e);return `<button class="reaction ${r?.mine?'mine':''}" data-react="${x.id}" data-emoji="${e}">${e} ${r?.count||''}</button>`}).join('')}</div><div class="comments">${x.comments.map(c=>`<div class="comment"><b>${esc(c.display_name)}:</b> ${esc(c.text)}</div>`).join('')}<form class="comment-form" data-comment="${x.id}"><input name="text" maxlength="500" placeholder="Комментарий"><button class="primary">↑</button></form></div>${can?`<div class="actions"><button class="link edit" data-id="${x.id}">Изменить</button><button class="link remove" data-id="${x.id}">Удалить</button></div>`:''}`}</article>`}
function render(){if(!data?.company)return;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));content.innerHTML=`<section class="hero"><small>${esc(data.company.name)}</small><h1>${tab==='ideas'?'Что сделаем вместе?':tab==='vote'?'Выбираем следующее':tab==='activity'?'Текущий план':'Наши воспоминания'}</h1><p>${data.members.length} участников</p></section><section class="section" id="body"></section>`;const b=document.querySelector('#body');if(tab==='ideas')ideas(b);if(tab==='vote')vote(b);if(tab==='activity')activity(b);if(tab==='archive')archive(b)}
function ideas(b){const list=data.ideas.filter(x=>x.difficulty<=filters.difficulty&&x.budget<=filters.budget&&x.duration<=filters.duration);b.innerHTML=`<div class="head"><h2>Идеи</h2><div><button class="link" id="invite">Пригласить</button><button class="pill hot" id="add">+ Идея</button></div></div><div class="filters">${['difficulty','budget','duration'].map((k,i)=>`<select data-filter="${k}"><option value="5">${['Сложность','Бюджет','Время'][i]} ≤ 5</option>${[1,2,3,4].map(n=>`<option value="${n}" ${filters[k]===n?'selected':''}>≤ ${n}</option>`).join('')}</select>`).join('')}</div><button class="secondary" id="random">🎲 Случайная идея</button>${list.map(x=>card(x)).join('')||'<div class="empty">Ничего не найдено</div>'}`;invite.onclick=()=>tg?.openTelegramLink(`https://t.me/lets_go_friends_bot?start=join_${data.company.invite_code}`);add.onclick=()=>openIdea();random.onclick=()=>list.length&&flash(Error(`Сегодня: ${list[Math.floor(Math.random()*list.length)].title} 🎉`));document.querySelectorAll('[data-filter]').forEach(x=>x.onchange=()=>{filters[x.dataset.filter]=+x.value;render()});document.querySelectorAll('[data-react]').forEach(x=>x.onclick=()=>act(`/api/ideas/${x.dataset.react}/reactions`,{emoji:x.dataset.emoji}));document.querySelectorAll('[data-comment]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const text=new FormData(f).get('text');if(text.trim())act(`/api/ideas/${f.dataset.comment}/comments`,{text})});document.querySelectorAll('.edit').forEach(x=>x.onclick=()=>openIdea(data.ideas.find(i=>i.id===+x.dataset.id)));document.querySelectorAll('.remove').forEach(x=>x.onclick=()=>confirm('Удалить идею?')&&act(`/api/ideas/${x.dataset.id}`,{},'DELETE'))}
function vote(b){const v=data.vote,me=v?.members.find(m=>+m.id===+data.user.id);if(v){b.innerHTML=`<div class="notice">Организатор: <b>${esc(v.organizer)}</b><br>${me?.idea_title?`Ваш выбор: <b>${esc(me.idea_title)}</b>. Можно изменить.`:'Вы ещё не голосовали.'}</div>${data.ideas.map(x=>card(x,true,me?.idea_title)).join('')}<div class="card"><b>✅ Проголосовали:</b> ${v.members.filter(x=>x.idea_title).map(x=>esc(x.display_name)).join(', ')||'никто'}<br><b>⏳ Ожидаем:</b> ${v.members.filter(x=>!x.idea_title).map(x=>esc(x.display_name)).join(', ')||'все'}<button class="primary" id="closeVote">Завершить голосование</button></div>`;document.querySelectorAll('.vote-btn').forEach(x=>x.onclick=()=>act('/api/vote/cast',{round_id:v.id,idea_id:+x.dataset.id}));closeVote.onclick=()=>act('/api/vote/close',{round_id:v.id});return}const p=data.date_poll;if(p){const owner=+data.user.id===+data.company.owner_id||+data.user.id===+p.created_by;b.innerHTML=`<div class="notice">Победила идея <b>${esc(p.title)}</b>. Выберите удобную дату.</div>${p.options.map(o=>`<button class="secondary date-choice ${o.mine?'selected':''}" data-option="${o.id}">${new Date(o.scheduled_at).toLocaleString('ru-RU')} · ${o.votes} голосов</button>`).join('')||'<div class="empty">Даты ещё не предложены.</div>'}${owner?`<form id="dateForm"><label>Добавить вариант</label><input type="datetime-local" name="scheduled_at" required><button class="primary">Добавить дату</button></form><div class="actions">${p.options.map(o=>`<button class="pill confirm-date" data-option="${o.id}">Назначить ${new Date(o.scheduled_at).toLocaleDateString('ru-RU')}</button>`).join('')}</div>`:''}`;document.querySelectorAll('.date-choice').forEach(x=>x.onclick=()=>act('/api/date/vote',{option_id:+x.dataset.option}));if(owner){dateForm.onsubmit=e=>{e.preventDefault();act('/api/date/options',{round_id:p.id,scheduled_at:new FormData(e.target).get('scheduled_at')})};document.querySelectorAll('.confirm-date').forEach(x=>x.onclick=async()=>{await act('/api/date/confirm',{option_id:+x.dataset.option});tab='activity';await refresh()})}return}b.innerHTML='<div class="empty">Нужно хотя бы две идеи.</div><button class="primary" id="startVote">Начать голосование</button>';startVote.onclick=()=>act('/api/vote/start')}
function activity(b){const a=data.activity;if(!a){b.innerHTML='<div class="empty">Нет запланированной активности.</div>';return}const me=data.activity_people.find(x=>+x.id===+data.user.id);b.innerHTML=`<article class="card winner"><small>ЗАПЛАНИРОВАНО</small><h3>${esc(a.title)}</h3><p>${new Date(a.scheduled_at).toLocaleString('ru-RU')}</p></article><div class="card"><b>Подтверждения</b>${data.activity_people.map(x=>`<p>${x.confirmed?'✅':'⏳'} ${esc(x.display_name)}</p>`).join('')}${!me?.confirmed?'<button class="primary" id="confirmActivity">Я участвовал(а)</button>':'<div class="notice">Ваше подтверждение получено</div>'}<form id="photoForm"><label>Добавить фото — без него ачивка не выдаётся</label><input type="file" name="photo" accept="image/jpeg,image/png,image/webp" required><button class="secondary">Загрузить</button></form></div>`;if(!me?.confirmed)confirmActivity.onclick=()=>act(`/api/activity/${a.id}/confirm`);photoForm.onsubmit=e=>{e.preventDefault();act(`/api/activity/${a.id}/photo`,new FormData(e.target))}}
function archive(b){b.innerHTML=data.archive.map(x=>`<article class="card"><small>🏆 ВЫПОЛНЕНО</small><h3>${esc(x.title)}</h3><div class="gallery">${x.photos.map(p=>`<img class="archive-photo" data-photo="${p.id}">`).join('')}</div><button class="secondary share" data-title="${esc(x.title)}">Поделиться</button></article>`).join('')||'<div class="empty">Здесь появятся выполненные приключения.</div>';photos();document.querySelectorAll('.share').forEach(x=>x.onclick=()=>tg?.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(location.origin)}&text=${encodeURIComponent(`Мы сделали это: ${x.dataset.title} 🏆`)}`))}
async function photos(){for(const img of document.querySelectorAll('[data-photo]'))try{const r=await fetch(`/api/archive/photo/${img.dataset.photo}`,{headers:{'X-Telegram-Init-Data':init}});if(!r.ok)throw 0;img.src=URL.createObjectURL(await r.blob())}catch(_){img.replaceWith('Фото недоступно')}}
function openIdea(x=null){editing=x?.id||null;ideaTitle.textContent=x?'Изменить идею':'Новая идея';ideaForm.reset();if(x){ideaForm.title.value=x.title;ideaForm.description.value=x.description||'';ideaForm.anonymous.checked=!!x.anonymous;['difficulty','budget','duration'].forEach(k=>ideaForm.querySelector(`[name=${k}][value="${x[k]}"]`).checked=true)}modal('#ideaModal')}
function account(){const s=data.settings;accountBody.innerHTML=`<h3>Мои компании</h3>${data.companies.map(c=>`<button class="secondary switch" data-id="${c.id}" ${c.active?'disabled':''}>${c.active?'✓ ':''}${esc(c.name)}</button>`).join('')}<button class="primary" id="newCompany">+ Новая компания</button>${+data.company.owner_id!==+data.user.id?'<button class="danger" id="leaveCompany">Выйти из компании</button>':''}<h3>Участники</h3><p>${data.members.map(x=>esc(x.display_name)).join(', ')}</p><h3>Напоминания</h3>${[['reminder_week','За неделю'],['reminder_day','За день'],['reminder_hours','За несколько часов'],['reminder_event','В момент начала'],['reminder_followup','После встречи']].map(([k,l])=>`<label class="setting">${l}<input type="checkbox" data-setting="${k}" ${s[k]?'checked':''}></label>`).join('')}<h3>Статистика</h3><p>🏆 ${data.stats.completed} · 💡 ${data.stats.ideas_created} · 🗳 ${data.stats.votes_cast}</p><p>${data.achievements.join('<br>')||'Первая ачивка уже близко!'}</p>`;modal('#accountModal');document.querySelectorAll('.switch').forEach(x=>x.onclick=()=>act('/api/company/switch',{company_id:+x.dataset.id}));newCompany.onclick=()=>{modal('#accountModal',false);modal('#companyModal')};leaveCompany?.addEventListener('click',()=>confirm('Выйти из компании?')&&act('/api/company/leave'));document.querySelectorAll('[data-setting]').forEach(x=>x.onchange=()=>{const body={};document.querySelectorAll('[data-setting]').forEach(y=>body[y.dataset.setting]=y.checked);act('/api/settings',body)})}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});avatar.onclick=account;document.querySelectorAll('.close').forEach(x=>x.onclick=()=>modal('#'+x.closest('.modal').id,false));gotIt.onclick=()=>{localStorage.setItem('lg-onboarding','1');modal('#onboarding',false)};const labels=[['difficulty','Сложность'],['budget','Бюджет'],['duration','Длительность']];ratings.innerHTML=labels.map(([n,l])=>`<label>${l} · 1–5</label><div class="rating">${[1,2,3,4,5].map(i=>`<input id="${n}${i}" type="radio" name="${n}" value="${i}" required><label for="${n}${i}">${i}</label>`).join('')}</div>`).join('');
ideaForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),body=Object.fromEntries(f);body.anonymous=f.has('anonymous');try{await api(editing?`/api/ideas/${editing}`:'/api/ideas',{method:editing?'PUT':'POST',body:JSON.stringify(body)});modal('#ideaModal',false);await refresh()}catch(e){flash(e)}};companyForm.onsubmit=async e=>{e.preventDefault();try{await api('/api/company',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});modal('#companyModal',false);await refresh()}catch(e){flash(e)}};load();
</script></body></html>
